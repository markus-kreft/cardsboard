[project]
name = "cardsboard"
version = "0.2.0"
requires-python = ">=3.10"
authors = [
  { name = "Markus Kreft", email = "mail@mkreft.de" },
]
description = "Terminal Kanban board"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
]
keywords = ["kanban", "tui", "todo", "cards", "board", "project management"]

[project.urls]
"Homepage" = "https://github.com/markus-kreft/cardsboard"
"Bug Tracker" = "https://github.com/markus-kreft/cardsboard/issues"

[project.scripts]
cardsboard = "cardsboard.__main__:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "ty>=0.0.51",
]
